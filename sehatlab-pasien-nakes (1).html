<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SehatLab – Pasien & Tenaga Kesehatan</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7ec;--card:#fff;--ink:#2b1f52;--mute:#6a6288;--line:#eadff0;--brand:#6c4bf4;--brand-ink:#fff;--soft:#efe9ff;--ok:#12805a;--okbg:#d8f6e8;--hi:#c62a4a;--hibg:#ffe1e8;--lo:#965f00;--lobg:#fff0c2;--c1:#ff5a5f;--c2:#f5a000;--c3:#12b48f;--c4:#2f8cff;--c5:#ee3d8f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1535;--card:#271f4c;--ink:#f4efff;--mute:#b8aedd;--line:#3b3068;--brand:#a58bff;--brand-ink:#1b1535;--soft:#342a63;--ok:#62e0a4;--okbg:#14392c;--hi:#ff9fb0;--hibg:#4b2033;--lo:#ffd166;--lobg:#463710;--c1:#ff8084;--c2:#ffc04d;--c3:#3fd9b4;--c4:#6cb0ff;--c5:#ff7ab8}}
:root[data-theme="dark"]{--bg:#1b1535;--card:#271f4c;--ink:#f4efff;--mute:#b8aedd;--line:#3b3068;--brand:#a58bff;--brand-ink:#1b1535;--soft:#342a63;--ok:#62e0a4;--okbg:#14392c;--hi:#ff9fb0;--hibg:#4b2033;--lo:#ffd166;--lobg:#463710;--c1:#ff8084;--c2:#ffc04d;--c3:#3fd9b4;--c4:#6cb0ff;--c5:#ff7ab8}
*{box-sizing:border-box;margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
html,body{min-height:100%}
body{background-color:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--brand) 16%,transparent) 1.6px,transparent 1.6px);background-size:24px 24px;color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.val,.tile b,.brand{font-family:Fredoka,Figtree,system-ui,sans-serif}
h1{font-size:26px;line-height:1.2;font-weight:700}h2{font-size:19px;font-weight:600;margin:18px 0 10px}h3{font-size:16px;font-weight:600}
a{color:var(--brand);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
#app{max-width:480px;margin:0 auto}body.nakes #app{max-width:1040px}
main{padding:20px 18px 100px}body.nakes main{padding-bottom:40px}
.mute{color:var(--mute);font-size:14px}.grow{flex:1;min-width:0}.right{text-align:right}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px}
.stack>*+*{margin-top:12px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}input[readonly]{background:var(--soft);color:var(--mute)}
textarea{min-height:100px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:0;border-radius:14px;color:var(--brand-ink);font-weight:700;text-decoration:none;width:100%;background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 85%,#fff),var(--brand));box-shadow:0 4px 0 color-mix(in srgb,var(--brand) 55%,#000);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--brand) 55%,#000)}
.btn.ghost,.btn.danger{background:transparent;color:var(--brand);border:2px solid var(--brand);box-shadow:none}.btn.danger{color:var(--hi);border-color:var(--hi)}
.btn.sm{width:auto;min-height:38px;padding:0 14px;font-size:14px}.btn.ghost:active,.btn.danger:active{transform:none}
.note{border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:14px;background:var(--soft);border:2px dashed color-mix(in srgb,var(--brand) 35%,transparent)}
.note.err{background:var(--hibg);color:var(--hi);border:2px solid var(--hi)}.note.ok{background:var(--okbg);color:var(--ok);border:2px solid var(--ok)}
.chip{display:inline-block;font-size:12px;font-weight:800;padding:2px 10px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.hi{background:var(--hibg);color:var(--hi)}.chip.lo{background:var(--lobg);color:var(--lo)}.chip.n{background:var(--soft);color:var(--brand)}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;text-decoration:none;color:inherit;font-weight:400}
a.row{border-left:7px solid var(--a,var(--brand))}.row.warn{border-left-color:var(--c2);margin-bottom:16px}
.avatar{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:Fredoka,sans-serif;background:color-mix(in srgb,var(--a,var(--brand)) 20%,var(--card));color:var(--a,var(--brand))}
.hero{background:linear-gradient(135deg,#6c4bf4,#b44cf0 55%,#ff6b9d);color:#fff;position:relative;overflow:hidden;border-radius:26px;padding:22px;margin-bottom:18px;box-shadow:0 6px 0 color-mix(in srgb,#6c4bf4 45%,transparent)}
.hero::before{content:"";position:absolute;right:-34px;top:-34px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.18)}
.hero::after{content:"";position:absolute;right:46px;bottom:-44px;width:86px;height:86px;border-radius:50%;background:rgba(255,205,60,.45)}
.hero>*{position:relative;z-index:1}.hero h1{font-size:30px}.hero p{opacity:.92;font-size:14px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:flex;flex-direction:column;gap:8px;min-height:110px;padding:14px;border-radius:20px;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid color-mix(in srgb,var(--t) 30%,var(--line));box-shadow:0 4px 0 color-mix(in srgb,var(--t) 30%,transparent)}
.tile .ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--t) 16%,var(--card))}
.tile:active{transform:translateY(3px);box-shadow:none}.tile.lock{opacity:.6;filter:grayscale(.55)}.tile.lock::after{content:"\1F512";position:absolute;top:8px;right:10px}
.logo{width:68px;height:68px;border-radius:22px;transform:rotate(-7deg);display:grid;place-items:center;font-size:32px;margin-bottom:18px;background:linear-gradient(135deg,var(--c1),var(--c5) 50%,var(--brand));box-shadow:0 6px 0 color-mix(in srgb,var(--c5) 35%,transparent)}
.login{padding:24px 0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--soft);padding:4px;border-radius:12px;margin:16px 0 4px}
.seg button{border:0;background:transparent;min-height:42px;border-radius:9px;font-weight:700;font-size:13px;color:var(--mute)}.seg button[aria-pressed=true]{background:var(--card);color:var(--brand)}
.back{display:inline-block;margin-bottom:8px;text-decoration:none;min-height:40px}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px color-mix(in srgb,var(--brand) 18%,transparent);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:4px 8px}
.bnav a{display:flex;flex-direction:column;align-items:center;padding:7px 0;border-radius:16px;font-size:12px;text-decoration:none;color:var(--mute)}.bnav a span{font-size:20px}
.bnav a[aria-current=page]{background:var(--soft);color:var(--brand)}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px;background:var(--card);border-bottom:2px solid var(--line)}
.brand{font-size:20px;font-weight:700;text-decoration:none;color:var(--ink)}.brand small{font-size:12px;color:var(--mute);font-weight:500}
.tnav{display:flex;gap:6px}.tnav a{text-decoration:none;padding:6px 14px;border-radius:99px}.tnav a[aria-current=page]{background:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.stat .val{font-size:30px;font-weight:700}.stat:nth-child(1){border-top:6px solid var(--c1)}.stat:nth-child(2){border-top:6px solid var(--c3)}.stat:nth-child(3){border-top:6px solid var(--c4)}.stat:nth-child(4){border-top:6px solid var(--c2)}
.scroll{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;background:var(--card);border:2px solid var(--line)}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}.tbl th{background:var(--soft);color:var(--mute)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.actions .btn{width:auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 16px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:12px 0}.filters>div{flex:1;min-width:150px}.filters .btn{width:auto}
.lrow{display:grid;grid-template-columns:2fr 1.2fr 1fr .8fr .8fr;gap:8px;margin-bottom:8px}.lrow input{min-height:42px}
.lhead{font-size:12px;font-weight:700;color:var(--mute)}
@media (max-width:640px){.lrow{grid-template-columns:1fr 1fr}.lhead{display:none}}
.res{padding:12px 0;border-top:1px solid var(--line)}.res:first-child{border-top:0}.rhead{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.val{font-weight:700;font-size:20px}.val small{font-weight:500;font-size:13px;color:var(--mute)}
.bar{position:relative;height:10px;border-radius:9px;margin:10px 0 4px;background:linear-gradient(90deg,var(--lobg) 0 25%,var(--okbg) 25% 75%,var(--hibg) 75% 100%)}
.bar b{position:absolute;top:-4px;width:6px;height:16px;border-radius:3px;background:var(--ink);transform:translateX(-50%);border:2px solid var(--card)}
.paper{background:#fff;color:#1d1d2b;border-radius:14px;border:2px solid var(--line);padding:20px 18px;box-shadow:0 6px 0 color-mix(in srgb,var(--brand) 18%,transparent)}
.paper h4{font-family:Fredoka,sans-serif;font-size:14px;letter-spacing:.08em;color:#6c4bf4}
.paper .lh{display:flex;justify-content:space-between;gap:8px;border-bottom:2px solid #6c4bf4;padding-bottom:10px;margin-bottom:14px;font-size:12px;color:#6a6288}
.paper h2{text-align:center;font-size:18px;margin:6px 0 2px;color:#1d1d2b}
.pr{display:grid;grid-template-columns:130px 1fr;gap:7px 12px;font-size:14px;margin-top:12px}.pr span{color:#6a6288}.pr b{font-weight:600;word-break:break-word}
.sg{margin-top:22px;text-align:right;font-size:14px}
.m3{grid-template-columns:repeat(3,1fr)}.m3 .tile{align-items:center;text-align:center;min-height:98px;padding:10px 4px;gap:6px;font-size:13px;line-height:1.25}.m3 .tile .ic{width:42px;height:42px}
@media (prefers-reduced-motion:no-preference){main>*{animation:in .2s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
@media print{.noprint,.bnav,.top{display:none!important}body{background:#fff}#app{max-width:none}main{padding:0}.paper,.card{box-shadow:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
const KEY='sehatlab-nakes-v1';
const POLI={'Poli Umum':['dr. Ayu Pratiwi'],'Penyakit Dalam':['dr. Bagus Wirawan, Sp.PD'],'Anak':['dr. Citra Dewi, Sp.A'],'Kandungan':['dr. Dewi Anggraini, Sp.OG'],'Jantung':['dr. Eko Santoso, Sp.JP'],'Gigi':['dr. Fitri Handayani, Sp.KG']};
const JAM=['08.00','09.30','11.00','13.30','15.00'],BAYAR=['Umum','BPJS Kesehatan','Asuransi swasta'],JAB=['Dokter','Perawat','Analis Laboratorium','Radiografer','Bidan','Petugas Pendaftaran'],STAT=['menunggu','dipanggil','selesai','batal'],JK=['Perempuan','Laki-laki'],GOL=['A','B','AB','O'],RADIO=['Rontgen Thorax PA','USG Abdomen','CT Scan Kepala','Lainnya'];
const LABT={'Hematologi Rutin':[['Hemoglobin','g/dL',12,16],['Leukosit','×10³/µL',4,10],['Trombosit','×10³/µL',150,400],['Hematokrit','%',36,46],['Eritrosit','×10⁶/µL',4,5.5]],'Kimia Klinik':[['Glukosa puasa','mg/dL',70,100],['Kolesterol total','mg/dL',null,200],['SGPT (ALT)','U/L',null,35],['Ureum','mg/dL',15,40],['Kreatinin','mg/dL',0.6,1.1]],'Urinalisis':[['pH urine','',4.5,8],['Berat jenis','',1.005,1.03],['Leukosit sedimen','/LPB',null,5]]};
const DOCT={rujukan:{t:'Surat Rujukan',pre:'RJK',intro:'Dengan ini kami merujuk pasien berikut untuk pemeriksaan lanjutan.',note:'Surat berlaku 90 hari untuk satu kali kunjungan.',f:[['dokter','Dokter pemeriksa','text'],['diagnosis','Diagnosis','text'],['poli','Dirujuk ke poli','text'],['rs','Rumah sakit tujuan','text'],['alasan','Alasan rujukan','area']]},
kontrol:{t:'Surat Kontrol',pre:'KTL',intro:'Pasien berikut dijadwalkan untuk kontrol ulang.',note:'Bawa surat ini saat kontrol.',f:[['dokter','Dokter','text'],['poli','Poli','text'],['tgl_kontrol','Tanggal kontrol','date'],['jam','Jam kontrol','text'],['catatan','Catatan','area']]},
sks:{t:'Surat Keterangan Sakit',pre:'SKS',intro:'Menerangkan bahwa pasien di bawah ini memerlukan istirahat karena sakit.',note:'Surat ini dibuat untuk digunakan sebagaimana mestinya.',f:[['dokter','Dokter','text'],['diagnosis','Diagnosis','text'],['hari','Lama istirahat (hari)','number'],['mulai','Mulai tanggal','date']]}};
const EDU=[['Persiapan sebelum tes darah','Prosedur','Sebagian pemeriksaan butuh puasa, misalnya glukosa dan profil lipid. Ikuti instruksi pada surat pengantar. Air putih tetap boleh diminum. Beri tahu petugas jika Anda sedang minum obat atau suplemen.'],['Membaca hasil hematologi','Hasil lab','Hemoglobin rendah dapat menandakan anemia, sedangkan leukosit tinggi sering muncul saat infeksi. Nilai rujukan berbeda antar laboratorium, usia, dan jenis kelamin. Hasil di luar rujukan bukan diagnosis, konsultasikan dengan tenaga kesehatan.'],['Mengenali gejala demam berdarah','Penyakit','Demam tinggi mendadak 2–7 hari dapat disertai nyeri kepala, nyeri belakang mata, dan nyeri otot. Segera ke fasilitas kesehatan bila ada muntah terus-menerus, nyeri perut hebat, atau perdarahan.'],['Cuci tangan yang benar','Pencegahan','Cuci tangan dengan sabun dan air mengalir minimal 20 detik: telapak, punggung tangan, sela jari, dan kuku. Ini menurunkan risiko diare dan infeksi saluran napas.']];

/* ---------- util ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return iso(d)};
const fd=s=>{const d=new Date((s||'')+'T00:00');return isNaN(d)?(s||'-'):d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})};
const validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')&&!isNaN(new Date(s+'T00:00'));
const num=s=>{const t=String(s).trim().replace(',','.');return /^-?\d+(\.\d+)?$/.test(t)?parseFloat(t):null};
const g=x=>String(+x.toPrecision(6));
async function hash(p,s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s+p)h=(h*33^c.charCodeAt(0))>>>0;return 'x'+h}}
const judge=(v,lo,hi)=>{const f=lo!=null&&v<lo?'lo':hi!=null&&v>hi?'hi':'ok';let p=50;if(lo!=null&&hi!=null&&hi>lo)p=25+(v-lo)/(hi-lo)*50;else if(hi)p=10+v/hi*65;else if(lo)p=25+(v-lo)/(lo*.5)*50;return[f,Math.round(Math.max(3,Math.min(97,p))*10)/10]};
const rtxt=(lo,hi,u)=>lo==null&&hi==null?'-':((lo==null?'≤ '+g(hi):hi==null?'≥ '+g(lo):g(lo)+' – '+g(hi))+' '+u).trim();
const mkItem=(n,v,u,lo,hi)=>{const[f,p]=judge(v,lo,hi);return{n,v:g(v),u,lo,hi,f,p,r:rtxt(lo,hi,u)}};
const FL={ok:'Normal',lo:'Rendah',hi:'Tinggi'};

/* ---------- data ---------- */
let DB=null,SESS=null,mem={};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}};
const storeOK=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true}catch(e){return false}})();
const WARN='<div class="note err" role="alert">Penyimpanan browser tidak tersedia di tampilan ini, jadi akun dan profil tidak akan tersimpan setelah halaman ditutup. Buka lewat link yang dibagikan, atau unduh filenya lalu buka di browser.</div>';
const save=()=>store.set(KEY,JSON.stringify(DB));
const nid=()=>++DB.n;
async function seed(){
 const mk=async(email,role,nama,jabatan)=>{const salt=Math.random().toString(36).slice(2);return{email,role,nama,jabatan,salt,pw:await hash('demo12345',salt)}};
 DB={n:0,users:[await mk('nakes@demo.id','nakes','Ni Made Sari, A.Md.AK','Analis Laboratorium'),await mk('pasien@demo.id','pasien','Siti Aminah')],patients:[],regs:[],labs:[],docs:[]};
 const t=today(),pid=newPatient({uid:'pasien@demo.id',email:'pasien@demo.id',nama:'Siti Aminah',tgl:'1998-05-14',jk:'Perempuan',tel:'0812-3456-7890',alamat:'Jl. Contoh No. 12, Kota Contoh',gol:'O'});
 const lab=(jenis,vals,ago)=>DB.labs.push({id:nid(),pid,kat:'Lab',jenis,tgl:addDays(t,-ago),catatan:'',items:LABT[jenis].map((x,i)=>mkItem(x[0],vals[i],x[1],x[2],x[3]))});
 lab('Hematologi Rutin',[11.2,11.9,265,38,4.6],3);lab('Kimia Klinik',[108,187,24,28,0.7],3);
 DB.labs.push({id:nid(),pid,kat:'Radiologi',jenis:'Rontgen Thorax PA',tgl:addDays(t,-2),catatan:'Cor dan pulmo dalam batas normal.',items:[]});
 DB.docs.push({id:nid(),pid,jenis:'kontrol',no:'KTL/'+t.slice(0,4)+'/0001',tgl:t,rows:[['Tanggal terbit',fd(t)],['Dokter','dr. Bagus Wirawan, Sp.PD'],['Poli','Penyakit Dalam'],['Tanggal kontrol',fd(addDays(t,7))],['Jam kontrol','09.30'],['Catatan','Bawa hasil laboratorium terbaru']],ttd:'Ni Made Sari, A.Md.AK',jab:'Analis Laboratorium'});
 DB.regs.push({id:nid(),pid,poli:'Penyakit Dalam',dokter:'dr. Bagus Wirawan, Sp.PD',tgl:addDays(t,1),jam:'09.30',keluhan:'Kontrol hasil laboratorium',bayar:'Umum',no:1,status:'menunggu'});
 migrate();save();
}
function newPatient(o){const id=nid(),rm='RM-'+String(DB.patients.length+1).padStart(6,'0');DB.patients.push({id,rm,uid:null,email:'',nama:'',tgl:'',jk:'',tel:'',alamat:'',gol:'',...o});return id}
const me=()=>DB.users.find(u=>u.email===SESS);
const myp=()=>DB.patients.find(p=>p.uid===SESS);
const pat=id=>DB.patients.find(p=>p.id===+id);
const profOk=p=>!!(p&&p.nama&&p.tgl&&p.jk&&p.tel&&p.alamat);
const byDate=(a,b)=>b.tgl.localeCompare(a.tgl)||b.id-a.id;

/* ---------- state & ui helpers ---------- */
const S={view:'home',tab:'masuk',arg:null,msg:null,date:today(),stat:'',q:'',cf:'',draft:null,fails:{}};
const inp=(n,l,v,t,o)=>{o=o||{};return `<label for="${n}">${l}</label><input id="${n}" name="${n}" type="${t||'text'}" value="${esc(v)}" ${o.req===false?'':'required'} ${o.ph?`placeholder="${esc(o.ph)}"`:''} ${o.ro?'readonly':''} ${o.min!=null?`min="${o.min}" max="${o.max}"`:''} ${o.max!=null&&o.min==null?`max="${o.max}"`:''} ${o.inm?`inputmode="${o.inm}"`:''} ${o.ml?`maxlength="${o.ml}"`:''}>`};
const sel=(n,l,opts,v,req)=>{req=req!==false;return `<label for="${n}">${l}</label><select id="${n}" name="${n}" ${req?'required':''}><option value="">${req?'Pilih '+l.toLowerCase():'(kosongkan)'}</option>${opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`};
const ta=(n,l,v,req,ph)=>`<label for="${n}">${l}</label><textarea id="${n}" name="${n}" ${req===false?'':'required'} placeholder="${esc(ph||'')}">${esc(v)}</textarea>`;
const chip=s=>`<span class="chip ${({menunggu:'lo',dipanggil:'n',selesai:'ok',batal:'hi'})[s]||'n'}">${s[0].toUpperCase()+s.slice(1)}</span>`;
const A=(act,v,txt,cls,extra)=>`<a href="#" class="${cls||''}" data-act="${act}" data-v="${esc(v==null?'':v)}" ${extra||''}>${txt}</a>`;
const flash=(t,m)=>{S.msg={t,m}};

function mkPdf(items){const W=595,H=842,M=56,BS=String.fromCharCode(92),pages=[],MAP={'×':'x','–':'-','—':'-','·':'-','µ':'u','³':'^3','⁶':'^6','≤':'<=','≥':'>='};let cs=[],y=H-M;
 const pe=s=>[...String(s)].map(c=>{if(MAP[c])return MAP[c];const n=c.normalize('NFD')[0],k=n.charCodeAt(0);return k>=32&&k<127?n:''}).join('').split(BS).join(BS+BS).split('(').join(BS+'(').split(')').join(BS+')');
 const np=()=>{pages.push(cs.join('\n'));cs=[];y=H-M},txt=(f,sz,x,t)=>cs.push('BT /'+f+' '+sz+' Tf '+x+' '+y+' Td ('+pe(t)+') Tj ET');
 const wrap=(t,n)=>{const o=[];let l='';for(const w of String(t).split(' ')){if((l+' '+w).trim().length>n){o.push(l);l=w}else l=(l+' '+w).trim()}o.push(l);return o};
 for(const it of items){const k=it[0];if(y<M+20)np();
  if(k==='h1'){y-=6;txt('F2',18,M,it[1]);y-=24}else if(k==='h2'){txt('F2',12,M,it[1]);y-=18}
  else if(k==='p'){for(const l of wrap(it[1],92)){if(y<M)np();txt('F1',11,M,l);y-=15}}
  else if(k==='row'){txt('F1',10.5,M,it[1]);wrap(it[2]||'-',58).forEach(l=>{if(y<M)np();txt('F2',10.5,M+175,l);y-=15})}
  else if(k==='sp')y-=10;else if(k==='hr'){cs.push(M+' '+y+' m '+(W-M)+' '+y+' l S');y-=12}}
 np();const o=[];o[1]='<< /Type /Catalog /Pages 2 0 R >>';o[2]='<< /Type /Pages /Kids ['+pages.map((_,i)=>(5+i*2)+' 0 R').join(' ')+'] /Count '+pages.length+' >>';
 o[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';o[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
 pages.forEach((c,i)=>{const p=5+i*2;o[p]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(p+1)+' 0 R >>';o[p+1]='<< /Length '+c.length+' >>\nstream\n'+c+'\nendstream'});
 let out='%PDF-1.4\n';const xr=[];for(let i=1;i<o.length;i++){xr[i]=out.length;out+=i+' 0 obj\n'+o[i]+'\nendobj\n'}
 const x0=out.length;out+='xref\n0 '+o.length+'\n0000000000 65535 f \n'+xr.slice(1).map(v=>String(v).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+o.length+' /Root 1 0 R >>\nstartxref\n'+x0+'\n%%EOF';
 return new TextEncoder().encode(out)}

 konend(el){const c=DB.consults.find(x=>x.id===+el.dataset.id);if(c){c.status='selesai';save();flash('ok','Konsultasi ditandai selesai.')}go('kons')},
 newcode(){DB.staffCode=rand10();save();flash('ok','Kode registrasi baru dibuat.');render()}
});
Object.assign(FORMS,{
 konsul(d){const t=(d.keluhan||'').trim();if(t.length<5){flash('err','Tulis keluhan minimal 5 karakter.');return render()}
  const u=DB.users.find(x=>x.email===S.pickN&&x.role==='nakes');if(!u){flash('err','Pilih tenaga kesehatan.');return render()}
  const id=nid();DB.consults.push({id,pid:myp().id,nk:u.email,nkName:u.nama,status:'terbuka',msgs:[{f:'p',t:t.slice(0,1000),ts:Date.now()}]});save();S.pickN=null;flash('ok','Keluhan terkirim. Balasan muncul di halaman ini.');go('konsulc',id)},
 konmsg(d){const c=DB.consults.find(x=>x.id===+S.arg&&x.pid===myp().id),t=(d.t||'').trim();if(!c||c.status==='selesai')return;if(!t){flash('err','Pesan tidak boleh kosong.');return render()}c.msgs.push({f:'p',t:t.slice(0,1000),ts:Date.now()});save();render()},
 konreply(d){const c=DB.consults.find(x=>x.id===+S.arg&&x.nk===me().email),t=(d.t||'').trim();if(!c||c.status==='selesai')return;if(!t){flash('err','Balasan tidak boleh kosong.');return render()}c.msgs.push({f:'n',t:t.slice(0,1000),ts:Date.now()});save();flash('ok','Balasan terkirim.');render()},
 pen(d){const ix=Object.keys(d).filter(k=>/^ex\d+$/.test(k)).map(k=>+k.slice(2)).filter(i=>EXAM[i]);
  if(!ix.length){flash('err','Pilih minimal satu pemeriksaan.');return render()}if(!validDate(d.tgl)||d.tgl<today()||d.tgl>addDays(today(),180)){flash('err','Pilih tanggal pemeriksaan mulai hari ini.');return render()}
  const tot=ix.reduce((a,i)=>a+EXAM[i][2],0),nm=ix.map(i=>EXAM[i][0]),p=myp(),no=kode('PMR');DB.bookings.push({id:nid(),pid:p.id,kind:'lab',title:'Lab & Radiologi',items:nm,tgl:d.tgl,total:tot,status:'terjadwal',no});const b=addBill(p.id,'Pemeriksaan lab/radiologi',tot);save();
  finish({title:'Jadwal pemeriksaan dibuat',kode:no,rows:[['Pemeriksaan',nm.join(', ')],['Jadwal',fd(d.tgl)],['Total biaya',money(tot)],['Catatan','Datang 15 menit lebih awal']],bill:b})},
 mcu(d){const m=MCU[+d.mp];if(!m){flash('err','Pilih paket.');return render()}if(!validDate(d.tgl)||d.tgl<today()||d.tgl>addDays(today(),180)){flash('err','Pilih tanggal MCU mulai hari ini.');return render()}
  const p=myp(),no=kode('MCU');DB.bookings.push({id:nid(),pid:p.id,kind:'mcu',title:'MCU '+m[0],items:['Paket MCU '+m[0],...m[2]],tgl:d.tgl,total:m[1],status:'terjadwal',no});const b=addBill(p.id,'Medical Check Up '+m[0],m[1]);save();
  finish({title:'Paket MCU dipesan',kode:no,rows:[['Paket','MCU '+m[0]],['Jadwal',fd(d.tgl)+', 07.30'],['Total biaya',money(m[1])],['Persiapan','Puasa 10–12 jam sebelum pemeriksaan']],bill:b})}
});
document.addEventListener('input',e=>{if(e.target.id==='qs'){const r=$('#rl');if(r)r.innerHTML=rsRows(e.target.value.trim())}});
document.addEventListener('change',e=>{const el=e.target;
 if(el.name&&/^ex\d+$/.test(el.name)&&$('#tot')){$('#tot').textContent=money([...document.querySelectorAll('input[name^="ex"]:checked')].reduce((a,x)=>a+EXAM[+x.name.slice(2)][2],0))}
 if(el.dataset&&el.dataset.chg==='bstatus'&&['terjadwal','selesai','batal'].includes(el.value)){const b=DB.bookings.find(x=>x.id===+el.dataset.id);if(b){b.status=el.value;save();render()}}});

/* ---------- events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;e.preventDefault();const f=ACT[el.dataset.act];if(f)f(el)});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const fn=FORMS[f.dataset.form];if(fn)fn(Object.fromEntries(new FormData(f)))});
document.addEventListener('change',e=>{const el=e.target;
 if(el.id==='poli'&&el.form&&el.form.dataset.form==='regnew'){const d=$('#dokter');d.innerHTML=(POLI[el.value]||[]).map(x=>`<option>${esc(x)}</option>`).join('')||'<option value="">Pilih poli dahulu</option>'}
 if(el.dataset&&el.dataset.chg==='status'){const r=DB.regs.find(x=>x.id===+el.dataset.id);if(r&&STAT.includes(el.value)){r.status=el.value;save();render()}}});

/* ---------- init ---------- */
(async function init(){
 try{DB=JSON.parse(store.get(KEY))}catch(e){DB=null}
 if(!DB||!DB.users)await seed();
 migrate();save();
 SESS=store.get(KEY+'-s');if(SESS&&!me())SESS=null;
 render();
})();
})();
</script>
